
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Quiz Free Fire</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#101522;color:white;text-align:center;padding:20px}
.card{max-width:500px;margin:30px auto;background:#202a3d;padding:24px;border-radius:18px;border:2px solid #ff9d00}
h1{color:#ff9d00}
button{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:10px;background:#ff9d00;color:#111;font-weight:bold;font-size:16px}
button:active{background:#ffc04d}
#info{color:#b9c6d9}
</style>
</head>
<body>
<div class="card">
<h1>🔥 QUIZ FREE FIRE 🔥</h1>
<p>Uji pengetahuanmu tentang Free Fire!</p>
<p id="info">Soal 1 dari 5</p>
<h3 id="question"></h3>
<div id="answers"></div>
<p id="result"></p>
<button id="next" hidden onclick="nextQuestion()">Soal Berikutnya ➜</button>
</div>
<script>
const quiz=[
{q:"Siapa karakter yang memiliki skill Drop the Beat?",a:["Alok","Kelly","Hayato","Moco"],c:0},
{q:"Apa nama mata uang utama untuk membeli item premium?",a:["Gold","Diamond","Token","Koin"],c:1},
{q:"Senjata mana yang termasuk sniper?",a:["MP40","M1887","AWM","UMP"],c:2},
{q:"Apa tujuan utama dalam mode Battle Royale?",a:["Bertahan hingga akhir","Mengumpulkan ikan","Balapan","Membangun rumah"],c:0},
{q:"Kendaraan apa yang bisa digunakan untuk berkeliling map?",a:["Sepeda air","Mobil","Pesawat kertas","Kereta bawah tanah"],c:1}
];
let index=0,score=0,answered=false;
function showQuestion(){
answered=false;
document.getElementById("info").textContent=`Soal ${index+1} dari ${quiz.length}`;
document.getElementById("question").textContent=quiz[index].q;
document.getElementById("result").textContent="";
document.getElementById("next").hidden=true;
const box=document.getElementById("answers");box.innerHTML="";
quiz[index].a.forEach((answer,i)=>{
const b=document.createElement("button");
b.textContent=answer;
b.onclick=()=>checkAnswer(i);
box.appendChild(b);
});
}
function checkAnswer(choice){
if(answered)return;answered=true;
const correct=quiz[index].c;
if(choice===correct){score++;document.getElementById("result").textContent="✅ Benar!";}
else{document.getElementById("result").textContent="❌ Salah! Jawaban: "+quiz[index].a[correct];}
document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);
document.getElementById("next").hidden=false;
document.getElementById("next").textContent=index===quiz.length-1?"Lihat Nilai 🏆":"Soal Berikutnya ➜";
}
function nextQuestion(){
if(index<quiz.length-1){index++;showQuestion();}
else{
document.querySelector(".card").innerHTML=`<h1>🏆 SELESAI!</h1><h2>Nilai kamu: ${score*20}/100</h2><p>Jawaban benar: ${score} dari ${quiz.length}</p><button onclick="location.reload()">Main Lagi 🔄</button>`;
}
}
showQuestion();
</script>
</body>
</html>
